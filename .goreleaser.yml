# GoReleaser — anexa binários versionados à Release que o release-please criou.
#
# O fluxo completo, porque a divisão de trabalho não é óbvia:
#
#   release-please.yml  lê os Conventional Commits, abre o PR de release e,
#                       quando ele é mergeado, cria a TAG e a RELEASE com o
#                       CHANGELOG.md gerado. É ele que decide a versão.
#   release.yml         dispara na tag e chama este arquivo, que sobe os
#                       binários, checksums e SBOMs PARA DENTRO da Release
#                       que já existe.
#
# Nenhum dos dois cria a Release sozinho, e é isso que evita o "release
# already exists": este arquivo nunca é a primeira coisa a tocar na Release.
# Ver o `--skip=validate` no release.yml, que é o que torna o anexo possível.
#
# O binário sabe a própria versão porque os -ldflags abaixo reescrevem
# internal/platform/buildinfo, que é o que faz o `walletd version` dentro de
# qualquer artefato responder "o que eu estou rodando?" sem adivinhação.
#
# Validar uma mudança localmente sem publicar:
#   goreleaser check                          # config parseia
#   goreleaser release --snapshot --clean     # ensaio completo; precisa de syft no PATH
version: 2

project_name: walletd

before:
  hooks:
    - go mod tidy

builds:
  - id: walletd
    # One binary, three modes (api / workers / all) — see internal/platform/config.
    main: ./cmd/walletd
    binary: walletd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # -s -w strip the symbol table and DWARF, matching the Dockerfile.
      # The -X flags are the whole point: they make the binary versioned.
      - -s -w
      - -X github.com/chalkan3/backend-challenge-go/internal/platform/buildinfo.Version={{ .Version }}
      - -X github.com/chalkan3/backend-challenge-go/internal/platform/buildinfo.Commit={{ .Commit }}
      - -X github.com/chalkan3/backend-challenge-go/internal/platform/buildinfo.Date={{ .CommitDate }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    # README.md and ARCHITECTURE.md are the two documents that actually exist
    # in this repo and that a consumer of a *binary* needs: what the service
    # guarantees, and how it is put together. The globs this replaced named
    # LICENSE* and CHANGELOG* — files this repository has never had — so every
    # archive matched nothing for them and shipped the README alone. Pointing
    # at real files is the difference between a documented policy and a
    # decorative one. (The repo is unlicensed and has no CHANGELOG: that is a
    # fact about the repo, not something a glob should pretend to cover.)
    files:
      - README.md
      - ARCHITECTURE.md
    format_overrides:
      - goos: darwin
        formats: [tar.gz]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  # An SBOM per archive answers "what is actually inside the artifact?" — the
  # same supply-chain question the image release already answers for the image.
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  groups:
    - title: ":rocket: Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: ":bug: Bug fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: ":zap: Performance"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: ":books: Documentation"
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: ":construction_worker: CI / Build"
      regexp: '^.*?(ci|build|chore)(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: ":recycle: Refactor"
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 5
    - title: ":white_check_mark: Tests"
      regexp: '^.*?test(\([[:word:]]+\))??!?:.+$'
      order: 6
    - title: "Other changes"
      order: 999
  filters:
    exclude:
      - "^docs\\(octopus\\)"
      - "^chore\\(deps\\)"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch

release:
  github:
    owner: chalkan3
    name: backend-challenge-go
  # `append` NÃO é o padrão (o enum é keep-existing|append|prepend|replace, e o
  # default é `keep-existing`). Aqui ele é explícito porque torna a intenção
  # legível: com o release-please no fluxo, a Release e a tag nascem juntas
  # ANTES deste arquivo rodar, e o trabalho do GoReleaser é somar
  # binários/checksums/SBOMs ao que já está lá — não recriar.
  #
  # `keep-existing` (o default) também não sobrescreveria a Release, mas não diz
  # o que acontece com os assets e convida a dúvida. `append` responde.
  #
  # `draft: false` combina com isso: a Release do release-please já é pública,
  # então não há draft a promover. O resultado é uma Release com duas
  # contribuições: a narrativa (changelog, do release-please) e os artefatos
  # (do GoReleaser).
  mode: append
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Tag }}"
  footer: |
    ## Container image

    The same tag is published as a multi-arch image:

    ```
    docker pull ghcr.io/chalkan3/backend-challenge-go:{{ .Tag }}
    ```

    ## Verify this release

    Each tarball contains `walletd` plus `README.md` and `ARCHITECTURE.md`. To
    check the download and read the version the binary was linked with:

    ```sh
    sha256sum -c checksums.txt       # from the checksums.txt above
    tar xzf walletd_{{ .Version }}_linux_amd64.tar.gz
    ./walletd version                # prints {{ .Tag }}, the commit and the build date
    ```
