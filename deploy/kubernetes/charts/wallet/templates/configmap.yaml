{{/*
ConfigMap com a configuração NÃO-secreta compartilhada por todos os papéis.

O que é comum aos três modos (HTTP addr, filas, TTLs dos workers, issuer etc.)
fica aqui e entra por `envFrom` — assim adicionar uma variável nova é uma
mudança em um lugar só, e não em três blocos de env copiados.

O que VARIA por papel (WALLET_MODE, tamanho do pool, gate de workers,
identidade da instância) é renderizado em `wallet.commonEnv` (_env.tpl).

Os dois nomes que não são triviais:
  - `WALLET_DB_DSN` NÃO está aqui: ele carrega a senha e vive no Secret (secret.yaml).
  - `WALLET_AUTH_ISSUER` é o URL PÚBLICO (localhost:8080), porque é o valor que
    o token traz no claim `iss`; o JWKS é resolvido por dentro do cluster.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wallet.fullname" . }}
  labels:
    {{- include "wallet.labels" . | nindent 4 }}
data:
  WALLET_HTTP_ADDR: ":8080"
  WALLET_SHUTDOWN_GRACE: "20s"
  WALLET_LOG_LEVEL: "info"

  # ---- Auth (Keycloak / OIDC) ----------------------------------------------
  # O issuer vem de values.auth.issuer, NÃO de nodePorts.keycloak: o Keycloak
  # roda com KC_HOSTNAME_STRICT=false e deriva o `iss` do header Host da
  # requisição que emite o token. Quem pede token é o host, via
  # localhost:8080 (o mapping do kind), então é esse o valor que aparece no
  # token — e é ele que a validação precisa aceitar. O NodePort interno
  # (30080) nunca aparece em um `iss`.
  # auth.issuer é a URL completa do realm (…/realms/wallet), usada como está.
  WALLET_AUTH_ISSUER: {{ .Values.auth.issuer | trimSuffix "/" | quote }}
  WALLET_AUTH_JWKS_URL: {{ printf "http://%s:8080/realms/%s/protocol/openid-connect/certs" (include "wallet.keycloakHost" .) .Values.keycloak.realm | quote }}

  # ---- SQS ------------------------------------------------------------------
  WALLET_SQS_REQUEST_QUEUE: {{ .Values.sqs.external.requestQueue | quote }}
  WALLET_SQS_EVENTS_QUEUE: {{ .Values.sqs.external.eventsQueue | quote }}
  WALLET_SQS_DLQ_QUEUE: {{ .Values.sqs.external.dlqQueue | quote }}
  WALLET_SQS_WAIT_SECONDS: "5"
  WALLET_SQS_MAX_MESSAGES: "10"
  WALLET_SQS_VISIBILITY: "60"
  WALLET_SQS_MAX_RECEIVE: "5"

  # ---- Workers --------------------------------------------------------------
  # Os intervalos são os mesmos do compose; são eles que definem a latência
  # entre "evento gravado na outbox" e "publicado na fila".
  WALLET_CONSUMER_CONCURRENCY: "4"
  WALLET_OUTBOX_INTERVAL: "500ms"
  WALLET_OUTBOX_BATCH: "100"
  WALLET_OUTBOX_LEASE: "30s"
  WALLET_REFERENCE_INTERVAL: "1s"
  WALLET_REFERENCE_BATCH: "50"
  WALLET_REFERENCE_MAX_ATTEMPTS: "10"
  WALLET_REFERENCE_TTL: "15m"

  # ---- Diversos -------------------------------------------------------------
  WALLET_LEDGER_PAGE_MAX: "200"
