{{/*
PostgreSQL — the service's own database, plus a separate database for Keycloak.

Both Keycloak and the wallet use the same server, told apart by database name.
That is not the production shape (Keycloak wants its own instance, for blast
radius and backup cadence) but it is the right shape for a laptop: one pod, one
PVC, and — unlike compose, where Keycloak quietly falls back to embedded H2 —
both survive a pod restart with their data intact.

The image is `postgres:17-alpine`, the exact tag docker-compose.yml uses, so the
schema behaves identically in both environments.
*/}}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wallet.fullname" . }}-postgres-init
  labels:
    {{- include "wallet.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
data:
  # Runs only when the data directory is empty (first boot of the volume).
  10-keycloak-db.sh: |
{{ include "wallet.postgresInitScript" . | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "wallet.fullname" . }}-postgresql
  labels:
    {{- include "wallet.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "wallet.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "wallet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "wallet.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
      annotations:
        # Bump the checksum when the init script changes; the content is
        # inlined here because `include` on this same file would recurse.
        checksum/init: {{ include "wallet.postgresInitScript" . | sha256sum }}
    spec:
      securityContext:
        # The postgres image drops to its own uid; running as the image's user
        # keeps the PVC writable without a chown dance.
        fsGroup: 999
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER,     value: {{ .Values.postgresql.auth.username | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.postgresql.auth.password | quote }} }
            - { name: POSTGRES_DB,       value: {{ .Values.postgresql.auth.database | quote }} }
            # Subdirectory avoids the "initdb: directory not empty" failure that
            # happens when the volume root carries lost+found.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - { name: data,       mountPath: /var/lib/postgresql/data }
            - { name: init,       mountPath: /docker-entrypoint-initdb.d }
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes:
        - name: init
          configMap:
            name: {{ include "wallet.fullname" . }}-postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wallet.fullname" . }}-postgresql
  labels:
    {{- include "wallet.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
  selector:
    {{- include "wallet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
