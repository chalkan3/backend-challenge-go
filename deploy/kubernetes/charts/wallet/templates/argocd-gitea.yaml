{{/*
ArgoCD — the GitOps path, OPTIONAL and off by default.

Why the shape below
-------------------
ArgoCD has no notion of a local directory: an Application points at a repoURL
(git, Helm repo, or OCI), never at a path on someone's laptop. That is not a
configuration gap, it is the design — ArgoCD's whole job is to reconcile a
cluster against a *shared, versioned* source of truth.

So "point ArgoCD at the local chart folder" is implemented the way it would be
done for real, just with the pieces kept small and local:

    host ./deploy/kubernetes  ->  seeded into a Gitea repo inside the cluster
                                      |
                              ArgoCD Application (repoURL = gitea HTTP)
                                      |
                              renders charts/wallet, syncs the release

The seeded content is a copy of this directory. Pushing to it (or rerunning the
seed) is what triggers a sync — exactly the loop a developer would have against
GitHub, minus the network.

If that indirection is not what you want for a local experiment, skip ArgoCD
entirely: `make kind-deploy` does a plain `helm upgrade --install` and is the
supported path. This file exists to show the GitOps wiring, not to replace it.
*/}}
{{- if .Values.argocd.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
# ---------------------------------------------------------------------------
# Gitea: the in-cluster git host ArgoCD pulls from. Persistent volume so the
# seeded repo survives a pod restart during a demo.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: argocd
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: wallet-gitops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/part-of: wallet-gitops
    spec:
      initContainers:
        # ArgoCD's repo-server runs as a non-root user and needs a writable
        # HOME; the same init container also disables Gitea's install wizard so
        # the first boot is reproducible instead of interactive.
        - name: init
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /data/gitea/conf /data/git/repositories
              cat > /data/gitea/conf/app.ini <<'EOF'
              [server]
              HTTP_PORT = 3000
              DOMAIN = gitea.argocd.svc.cluster.local
              ROOT_URL = http://gitea.argocd.svc.cluster.local:3000/
              DISABLE_SSH = true
              [database]
              DB_TYPE = sqlite3
              PATH = /data/gitea/gitea.db
              [service]
              DISABLE_REGISTRATION = true
              REQUIRE_SIGNIN_VIEW = false
              [security]
              INSTALL_LOCK = true
              [openid]
              ENABLE_OPENID_SIGNIN = false
              EOF
              chown -R 1000:1000 /data || true
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: gitea
          image: gitea/gitea:1.23
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: GITEA__database__DB_TYPE, value: sqlite3 }
            - { name: GITEA__security__INSTALL_LOCK, value: "true" }
            - { name: GITEA__service__DISABLE_REGISTRATION, value: "true" }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { cpu: "1", memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: argocd
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: argocd
  labels:
    app.kubernetes.io/name: gitea
spec:
  ports:
    - { name: http, port: 3000, targetPort: http }
  selector:
    app.kubernetes.io/name: gitea
{{- end }}
