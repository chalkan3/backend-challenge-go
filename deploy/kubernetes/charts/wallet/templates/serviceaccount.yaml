{{/*
ServiceAccount for the wallet pods.

Only rendered when serviceAccount.create=true. The default is false, and the
defaults matter here: the app talks to no Kubernetes API (it is a database +
SQS client), so it needs no identity and no RBAC. Creating one anyway would be
ceremony.

When it *is* created, the pod template references it by name via the
wallet.serviceAccountName helper. Before this file existed, the deployments
referenced a `wallet` ServiceAccount that nothing created, and the pods sat in
ContainerCreating with
  failed to fetch token: serviceaccounts "wallet" not found
which `helm install --wait` only surfaced as a generic timeout.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wallet.serviceAccountName" . }}
  labels:
    {{- include "wallet.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
