{{/*
Credentials. In a real cluster these would come from an external secrets
operator or a sealed secret; for a local kind environment a chart-managed
Secret keeps the compose parity (wallet/wallet, admin/admin) obvious.

stringData is used on purpose: the values are plaintext anyway, and it keeps
`helm template` output readable when debugging.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wallet.fullname" . }}-db
  labels:
    {{- include "wallet.labels" . | nindent 4 }}
type: Opaque
stringData:
  WALLET_DB_DSN: {{ include "wallet.dbDsn" . | quote }}
  WALLET_SQS_ACCESS_KEY_ID: {{ .Values.sqs.external.accessKeyId | quote }}
  WALLET_SQS_SECRET_KEY: {{ .Values.sqs.external.secretKey | quote }}
