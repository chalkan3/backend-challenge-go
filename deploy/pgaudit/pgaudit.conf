# Configuração do pgAudit.
#
# Como este arquivo é lido: o Dockerfile anexa um `include =` apontando para cá
# no `postgresql.conf` que o initdb copia, então toda instância nova já nasce
# lendo estas diretivas. O serviço do compose passa só `command: ["postgres"]`
# — sem `-c` duplicando valores. Uma fonte de verdade, versionada e diffável.
#
# Carregamento: `shared_preload_libraries` só tem efeito no start do servidor,
# porque a extensão registra hooks de executor/utility. Um `ALTER SYSTEM` a
# quente não basta — precisa de restart. É por isso que esta diretiva mora na
# imagem e não numa migration.

# ---------------------------------------------------------------------------
# pgAudit
# ---------------------------------------------------------------------------
shared_preload_libraries = 'pgaudit'

# O que auditar:
#   write → INSERT, UPDATE, DELETE, TRUNCATE, COPY ... FROM (operações que
#           mudam dados)  ← isto é o que protege o ledger
#   ddl   → CREATE, ALTER, DROP, GRANT, REVOKE (mudanças de schema)
#   role  → CREATE/ALTER/DROP ROLE, GRANT ... TO ROLE
#   misc  → DISCARD, FETCH, CHECKPOINT, VACUUM, SET ...
#   read  → SELECT e COPY ... TO
#
# `read` fica DESLIGADO de propósito: o wallet faz um volume enorme de SELECT
# (toda leitura de saldo, toda listagem do ledger) e auditar leitura inundaria
# o log. O que interessa para a integridade do ledger é *escrita* — "quem
# alterou o que, quando".
pgaudit.log = 'write, ddl, role'

# Registra a relação (tabela) afetada em cada linha. Sem isto, um UPDATE em
# `wallet_ledger_entries` e um UPDATE em `wallets` são indistinguíveis no log
# além do próprio SQL. Com `on`, a linha vira
#   AUDIT: SESSION,2,1,WRITE,UPDATE,TABLE,public.wallet_ledger_entries
# — o nome da tabela auditada aparece estruturado.
pgaudit.log_relation = on

# Marca cada statement com um id de sessão/statement que correlaciona as linhas
# de um mesmo comando (útil quando uma transação tem N statements).
pgaudit.log_statement_once = off

# Inclui o texto completo do statement auditado (default já é on; explícito
# para não depender de default).
pgaudit.log_catalog = on

# ---------------------------------------------------------------------------
# Log base (formato que dá contexto à linha de auditoria)
# ---------------------------------------------------------------------------
# `log_line_prefix` com user, database, application_name e um trace id: é o
# que permite amarrar uma linha AUDIT: ao serviço que a emitiu.
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_statement = 'none'          # o pgAudit já cobre; evita duplicação
log_min_duration_statement = -1
log_connections = off           # o PgBouncer já loga conexões do lado do pooler
log_disconnections = off
