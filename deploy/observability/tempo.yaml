# Tempo — trace store. It speaks OTLP/gRPC to the Collector and exposes the
# TraceQL search API Grafana's trace panels and TraceQL queries use. Local
# filesystem storage keeps the demo self-contained; a real deployment swaps
# `local` for object storage (S3/GCS) with no change anywhere else.
server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Flush quickly: the demo is short-lived and a dashboard should show spans
  # within seconds, not after the default 10-minute block window.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

metrics_generator:
  # serverless-style metrics from spans, queryable from Prometheus if the
  # Collector's own spanmetrics is ever disabled.
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Accept out-of-order and older spans: workers drain at shutdown and those
# spans can arrive slightly late.
overrides:
  defaults:
    ingestion:
      max_traces_per_user: 0
