; ---------------------------------------------------------------------------
; PgBouncer — pool de conexões em frente ao Postgres.
;
; O ponto inteiro desta configuração é `pool_mode = transaction`: N conexões de
; cliente (do pgxpool de cada réplica) compartilham M conexões de servidor, e
; a conexão só volta pro pool quando a transação fecha. Sem o pooler, cada
; réplica abre até WALLET_DB_MAX_CONNS conexões *permanentes* na mesma instância
; de Postgres — 3 réplicas multi + api/workers split estouram max_connections
; com folga sob carga.
;
; O detalhe que quase todo mundo erra: `transaction` mode NÃO é compatível com
; prepared statements nomeados de forma ingênua, porque o backend do servidor
; troca entre clientes a cada transação. O pgx v5 detecta o PgBouncer pelo
; handshake e degrada sozinho para o protocolo simples, re-parseando o
; statement a cada execução — por isso a suíte de integração passa idêntica
; por aqui (ver README, seção "PgBouncer"). Se estivéssemos no pgx v3/v4, ou
; com um driver que fixa `statement_cache_mode=describe`, seria preciso
; `default_query_exec_mode=simple_protocol` no DSN.
;
; `session` mode seria a saída "segura" — e é justamente por isso que ele não
; serve: uma conexão fica amarrada ao cliente durante a sessão inteira, e o
; pooler vira um proxy caro sem multiplexação.
; ---------------------------------------------------------------------------

[databases]
; O host é resolvido pela rede do compose (alias do serviço `postgres`).
wallet = host=postgres port=5432 dbname=wallet

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Local, rede isolada do compose: sem senha de admin. Em produção, auth_type
; seria scram-sha-256 com auth_file (ou auth_query apontando pro Postgres).
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

; O coração da coisa: a conexão de servidor é devolvida ao pool no fim da
; transação, não no fim da sessão.
pool_mode = transaction

; Clientes: N réplicas × WALLET_DB_MAX_CONNS + margem para picos/psql.
max_client_conn = 300
; Backends: teto de conexões reais no Postgres. Dimensionar abaixo de
; max_connections (100) com folga para o superusuário/admin.
default_pool_size = 10
min_pool_size = 2
reserve_pool_size = 3
reserve_pool_timeout = 5

; SHOW POOLS / SHOW STATS expõem o multiplexing (cl_active vs sv_active) e viram
; a leitura de observabilidade do pooler. Sem isto, o comando nega com
; "FATAL: not allowed".
admin_users = wallet
stats_users = wallet

; Timeouts defensivos: cliente morto não segura backend nem transação.
server_idle_timeout = 60
client_idle_timeout = 0
query_timeout = 0
query_wait_timeout = 30
client_login_timeout = 10

; Log de conexões fica no PgBouncer, não no Postgres — assim
; `log_connections` do servidor não é inundado por reconexões.
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
