name: wallet

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm", "--http-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: "1"
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      WALLET_HTTP_ADDR: ":8080"
      WALLET_DB_DSN: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable
      WALLET_SQS_ENDPOINT: http://localstack:4566
      WALLET_SQS_REGION: us-east-1
      WALLET_SQS_ACCESS_KEY_ID: test
      WALLET_SQS_SECRET_KEY: test
      WALLET_AUTH_ISSUER: http://localhost:8080/realms/wallet
      # inside the compose network the IdP is reachable via the service name,
      # but tokens are issued with the localhost issuer ( callers run on host)
      WALLET_AUTH_JWKS_URL: http://keycloak:8080/realms/wallet/protocol/openid-connect/certs
      WALLET_WORKERS_ENABLED: "true"
      WALLET_LOG_LEVEL: info
      WALLET_OTEL_ENABLED: "${WALLET_OTEL_ENABLED:-false}"
      WALLET_OTEL_LOGS_ENABLED: "true"
      WALLET_OTEL_ENDPOINT: otel-collector:4317
      WALLET_OTEL_INSECURE: "true"
      WALLET_OTEL_SERVICE_NAME: wallet
      WALLET_ENV: local
      WALLET_OTEL_SAMPLE_RATIO: "${WALLET_OTEL_SAMPLE_RATIO:-1.0}"
      WALLET_INSTANCE_ID: wallet-1
    ports:
      - "8081:8080"

  # Extra instances for distributed-behaviour verification:
  #   docker compose --profile multi up
  app-2:
    profiles: ["multi"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      WALLET_HTTP_ADDR: ":8080"
      WALLET_DB_DSN: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable
      WALLET_SQS_ENDPOINT: http://localstack:4566
      WALLET_AUTH_ISSUER: http://localhost:8080/realms/wallet
      WALLET_AUTH_JWKS_URL: http://keycloak:8080/realms/wallet/protocol/openid-connect/certs
      WALLET_WORKERS_ENABLED: "true"
      WALLET_OTEL_ENABLED: "${WALLET_OTEL_ENABLED:-false}"
      WALLET_OTEL_LOGS_ENABLED: "true"
      WALLET_OTEL_ENDPOINT: otel-collector:4317
      WALLET_OTEL_INSECURE: "true"
      WALLET_OTEL_SERVICE_NAME: wallet
      WALLET_ENV: local
      WALLET_OTEL_SAMPLE_RATIO: "${WALLET_OTEL_SAMPLE_RATIO:-1.0}"
      WALLET_INSTANCE_ID: wallet-2
    ports:
      - "8082:8080"

  app-3:
    profiles: ["multi"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      WALLET_HTTP_ADDR: ":8080"
      WALLET_DB_DSN: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable
      WALLET_SQS_ENDPOINT: http://localstack:4566
      WALLET_AUTH_ISSUER: http://localhost:8080/realms/wallet
      WALLET_AUTH_JWKS_URL: http://keycloak:8080/realms/wallet/protocol/openid-connect/certs
      WALLET_WORKERS_ENABLED: "true"
      WALLET_OTEL_ENABLED: "${WALLET_OTEL_ENABLED:-false}"
      WALLET_OTEL_LOGS_ENABLED: "true"
      WALLET_OTEL_ENDPOINT: otel-collector:4317
      WALLET_OTEL_INSECURE: "true"
      WALLET_OTEL_SERVICE_NAME: wallet
      WALLET_ENV: local
      WALLET_OTEL_SAMPLE_RATIO: "${WALLET_OTEL_SAMPLE_RATIO:-1.0}"
      WALLET_INSTANCE_ID: wallet-3
    ports:
      - "8083:8080"

  # ---------------------------------------------------------------------------
  # Observability stack (profile "observability").
  #
  # Off by default so the challenge's core `docker compose up` stays exactly
  # as documented — Postgres, Keycloak, LocalStack and the app, nothing more.
  # `docker compose --profile observability up` adds the stack and
  # `WALLET_OTEL_ENABLED=true` (see .env) turns the export on.
  #
  #   app --OTLP--> otel-collector --+--> tempo   (traces)
  #                                  +--> loki    (logs)
  #                                  +--> prom    (derived RED metrics)
  #   app --/metrics scrape--> prometheus --> grafana
  # ---------------------------------------------------------------------------

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP/gRPC (the app exports here)
      - "4318:4318"   # OTLP/HTTP
      - "8889:8889"   # spanmetrics + servicegraph for Prometheus
      - "13133:13133" # health check
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - tempo
      - loki

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"   # Grafana queries traces here

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.5.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,nodeGraph
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  pgdata:
  promdata:
  tempodata:
  lokidata:
  grafanadata:
