name: wallet

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm", "--http-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: "1"
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      WALLET_HTTP_ADDR: ":8080"
      WALLET_DB_DSN: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable
      WALLET_SQS_ENDPOINT: http://localstack:4566
      WALLET_SQS_REGION: us-east-1
      WALLET_SQS_ACCESS_KEY_ID: test
      WALLET_SQS_SECRET_KEY: test
      WALLET_AUTH_ISSUER: http://localhost:8080/realms/wallet
      # inside the compose network the IdP is reachable via the service name,
      # but tokens are issued with the localhost issuer ( callers run on host)
      WALLET_AUTH_JWKS_URL: http://keycloak:8080/realms/wallet/protocol/openid-connect/certs
      WALLET_WORKERS_ENABLED: "true"
      WALLET_LOG_LEVEL: info
    ports:
      - "8081:8080"

  # Extra instances for distributed-behaviour verification:
  #   docker compose --profile multi up
  app-2:
    profiles: ["multi"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      WALLET_HTTP_ADDR: ":8080"
      WALLET_DB_DSN: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable
      WALLET_SQS_ENDPOINT: http://localstack:4566
      WALLET_AUTH_ISSUER: http://localhost:8080/realms/wallet
      WALLET_AUTH_JWKS_URL: http://keycloak:8080/realms/wallet/protocol/openid-connect/certs
      WALLET_WORKERS_ENABLED: "true"
    ports:
      - "8082:8080"

  app-3:
    profiles: ["multi"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      WALLET_HTTP_ADDR: ":8080"
      WALLET_DB_DSN: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable
      WALLET_SQS_ENDPOINT: http://localstack:4566
      WALLET_AUTH_ISSUER: http://localhost:8080/realms/wallet
      WALLET_AUTH_JWKS_URL: http://keycloak:8080/realms/wallet/protocol/openid-connect/certs
      WALLET_WORKERS_ENABLED: "true"
    ports:
      - "8083:8080"

volumes:
  pgdata:
