name: Release

# Cuts a GitHub Release: cross-platform binaries (GoReleaser) and a multi-arch
# container image (GHCR).
#
# Trigger: pushing a semver tag (v1.2.3) or running it manually. Nothing here
# runs on `main` pushes — releases are deliberate acts, not side effects of a
# merge.
#
# The two jobs are independent and run in parallel: a failure in one does not
# silently ship half a release, because the release is only as good as its
# weakest artifact. Both must be green for the run to be green.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write   # create the GitHub Release and upload artifacts
  packages: write   # push to GHCR

env:
  GO_VERSION: "1.26"
  REGISTRY: ghcr.io
  # Pinned, not floating: a release built by a different GoReleaser than the
  # one the config was validated against is a release whose config may not
  # parse. Bump deliberately.
  GORELEASER_VERSION: "v2.15.4"
  # GoReleaser's sboms pipe shells out to syft, and the runner image does not
  # ship it. Without this the binaries job fails at the very last step — after
  # every artifact was built — with `exec: "syft": executable file not found`.
  # Pinned for the same reason GoReleaser is.
  SYFT_VERSION: "v1.54.1"

jobs:
  # ── Binaries: the artifacts the image does not provide ─────────────────────
  # An image is enough to *run* the service; it is not enough to run it on a
  # laptop, in a scratch container without a registry, or on a machine that
  # cannot pull from GHCR. Versioned tarballs close that gap — and each one
  # reports its own tag, commit and build date via `walletd version`.
  binaries:
    name: binaries (goreleaser · linux/darwin · amd64/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser derives the changelog from history; a shallow clone
          # would produce a release note with a single commit in it.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The same gate the CI job enforces, restated at the release boundary:
      # a tag must not be able to publish a binary the tests never saw pass.
      - name: Unit tests (with race detector)
        run: go test -race -count=1 ./...

      # Auto-installs on the first run and is a cache hit afterwards.
      - name: Install syft (GoReleaser shells out to it for the SBOMs)
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Validate the GoReleaser config before it does anything
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ${{ env.GORELEASER_VERSION }}
          # `--skip=validate` é de propósito: o `validate` do GoReleaser
          # consulta a API do GitHub para checar se a tag já tem Release e
          # falha se tiver. Com o release-please no fluxo, a Release SEMPRE
          # existe antes deste job rodar — o release-please cria a Release e a
          # tag no mesmo passo, e é essa Release que o existe para receber os
          # binários. Sem o skip, o pipeline quebra exatamente no caminho
          # feliz. O que sobra do validate (o config parseia) é coberto pelo
          # passo `goreleaser check` acima, que roda antes de qualquer coisa.
          args: release --clean --skip=validate
        env:
          # Ver release-please.yml: com `--skip=validate`, o GoReleaser ANEXA
          # os artefatos a uma Release que já existe (a do release-please) e
          # não tenta criá-la. Os dois publicam a mesma Release, cada um com a
          # sua parte: o release-please escreve o changelog a partir dos
          # commits, o GoReleaser sobe binários, checksums e SBOMs.
          #
          # Sem `--skip=validate` isto falharia com "release already exists" —
          # e falharia só no fluxo automatizado, nunca num dispatch manual com
          # tag nova, que é o caminho em que isto foi testado antes.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Image: the runtime artifact, for both architectures ────────────────────
  # Building arm64 on an amd64 runner uses QEMU, which is slow but honest: the
  # same Dockerfile must produce the same binary on both, and a CGO_ENABLED=0
  # static build is what makes that possible.
  image:
    name: image (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # A manual dispatch is the one trigger with no tag behind it, so it is
          # the one that can be misspelled. Catching that here — before QEMU,
          # buildx and a 40-minute multi-arch build — is the whole point of
          # validating rather than trusting. `v*` keeps the manual path and the
          # tag path agreeing on what a release is called.
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::tag '$tag' is not a semver tag (expected e.g. v1.0.0)"
              exit 1
              ;;
          esac
          # The build date the image bakes into `walletd version`. It cannot
          # come from github.event.head_commit: that field is empty on a tag
          # push and on workflow_dispatch, which would silently ship
          # `DATE=` — an image reporting its version with a blank date. The
          # commit is the reliable source; this is the same field GoReleaser
          # uses for the tarballs' Date, so the two artifacts agree.
          date="$(git show -s --format=%cI "${{ github.sha }}")"
          {
            echo "tag=$tag"
            echo "date=$date"
          } >> "$GITHUB_OUTPUT"
          echo "releasing $tag (commit date $date)"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: OCI metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # This job only ever runs for tags (and manual dispatches), never
            # for a branch push, so `is_default_branch` would evaluate false
            # for the tag ref and `latest` would never be published. A tag IS
            # the default-branch release here; `semver` explains the tag in
            # tags that are not semver-ish, where this releases nothing.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            # The image's binary must know its version too — the same
            # buildinfo fields the GoReleaser tarballs carry, so `docker run
            # ... walletd version` and the tarball agree.
            VERSION=${{ steps.tag.outputs.tag }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.tag.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract the sbom for the amd64 image
        # An SBOM is the cheap, standard answer to "what is actually inside the
        # image you shipped?" — useful to a reviewer and to any supply-chain
        # check later.
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:sbom-${{ steps.tag.outputs.tag }}
          sbom: true
          provenance: true
          cache-from: type=gha
