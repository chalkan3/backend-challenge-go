name: CI

# Two jobs with different cost profiles:
#   quality — fast, hermetic, no containers. Runs on every push and PR.
#   e2e     — the real stack (Postgres + Keycloak + LocalStack) through the
#             same docker compose the README documents. This is the job that
#             proves the challenge's claims instead of asserting them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref cancels the previous run: CI minutes are a
# resource, and a superseded run's result is worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  # Compose project name, so the job can address containers deterministically.
  COMPOSE_PROJECT_NAME: wallet

jobs:
  # ── Fast feedback: formatting, vet, unit tests, race detector ──────────────
  quality:
    name: quality (fmt · vet · unit · race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Show the toolchain and the declared Go version
        # go.mod says 1.26.0 and the Dockerfile pins golang:1.26. Printing both
        # next to the runner's toolchain makes a drift visible in the log; the
        # hard check is that the runner satisfies go.mod, which `go build`
        # enforces on its own.
        run: |
          echo "runner:  $(go version)"
          echo "go.mod:  $(grep -E '^go ' go.mod)"
          echo "image:   $(grep -m1 '^FROM golang' Dockerfile)"

      - name: gofmt
        # Fails the build on any unformatted file, listing the offenders.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet (integration tag)
        # The integration files are behind a build tag; vet must see them too,
        # otherwise a compile error there only surfaces in the e2e job.
        run: go vet -tags=integration ./...

      - name: Unit tests (with race detector)
        run: go test -race -count=1 ./...

      - name: Coverage (ratchet toward 90%)
        # A two-sided gate, and the reasons matter:
        #
        #  • The TARGET is 90% of the unit suite, and it is a real goal, not
        #    decoration. The suite has now REACHED it (~90.0% measured), so the
        #    floor is raised to match: 90% is blocking from here on.
        #
        #  • The FLOOR below is a ratchet: it only ever moves up. It fails the
        #    build the moment coverage drops, which is the property that
        #    actually matters — a number that can fall silently is worse than
        #    no number. Raising the floor to the measured value is how the
        #    target becomes binding instead of aspirational.
        #
        # Why the number is honest and reachable: internal/postgres is tested
        # against a fake of its own `querier` interface (the same seam the
        # service uses), so the adapter's real logic — error translation, NULL
        # handling, scans, SQL shape — is covered without a database. What a
        # fake cannot prove (row locks, unique constraints, triggers) lives in
        # the integration suite behind the `integration` tag; that is why this
        # gate is on the unit suite only, and why the two together — not
        # either alone — are the claim.
        env:
          # The goal, now reached: the floor below equals it, so the gate is
          # hard. Keep the two equal unless a deliberate exception is intended.
          COVERAGE_TARGET: "90"
          # Ratchet floor: the current measured value, rounded down. Never
          # lower this without saying why in the commit message.
          COVERAGE_FLOOR: "90"
        run: |
          go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
          total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')"
          echo "unit coverage: ${total}%   (target: ${COVERAGE_TARGET}% · floor: ${COVERAGE_FLOOR}%)"

          # Integer-compare with awk to avoid a float comparison in bash.
          below_floor="$(awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { print (t >= f) ? "0" : "1" }')"
          if [ "$below_floor" = "1" ]; then
            echo "::error::coverage ${total}% dropped below the ${COVERAGE_FLOOR}% ratchet floor"
            # Name the packages dragging the total down, so the failure is
            # actionable rather than just red.
            python3 - <<'PY'
          import collections
          tot = collections.Counter()
          hit = collections.Counter()
          for line in open("coverage.out"):
              if line.startswith("mode:"):
                  continue
              loc, stmts, count = line.rsplit(" ", 2)
              f = loc.split(":")[0]
              tot[f] += int(stmts)
              if int(count) > 0:
                  hit[f] += int(stmts)
          rows = []
          for f in tot:
              missing = tot[f] - hit[f]
              if missing:
                  rows.append((100.0 * hit[f] / tot[f], missing, tot[f], f))
          rows.sort()
          print("lowest-covered files:")
          for pct, missing, total_f, f in rows[:10]:
              print(f"  {pct:5.1f}%  miss {missing:4d}/{total_f:4d}  {f}")
          PY
            exit 1
          fi

          # Progress toward the target, so the log shows the distance left.
          remaining="$(awk -v t="$total" -v g="$COVERAGE_TARGET" 'BEGIN { print (t < g) ? "1" : "0" }')"
          if [ "$remaining" = "1" ]; then
            echo "::notice::${total}% is below the ${COVERAGE_TARGET}% target — this is expected while the ratchet climbs; the build is not failed for it."
          fi

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # ── The real thing: docker compose + the integration suite ─────────────────
  e2e:
    name: e2e (compose · integration · race)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Show the stack that will be exercised
        run: docker compose version && docker --version

      # scripts/e2e.sh uses `docker compose` when podman-compose is absent,
      # which is exactly the ubuntu-latest case. The same script the README
      # documents for local runs is what CI runs — no parallel CI-only path
      # that could drift from the documented one.
      - name: Bring the stack up, run the suite, tear down
        run: ./scripts/e2e.sh

      - name: Logs from every service (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Container state (on failure)
        if: failure()
        run: docker compose ps

  # ── Load: the k6 smoke + the independent integrity audit ───────────────────
  load:
    name: load (k6 smoke · integrity audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Bring the stack up
        run: UP_ONLY=1 ./scripts/e2e.sh

      - name: k6 smoke — the whole contract, asserted
        # Runs from the pinned k6 image, so the CI version matches the local one.
        # This is the gate: a broken contract fails here in seconds.
        run: make load-smoke

      - name: k6 hot-wallet — the row lock under contention
        run: make load-hot VUS=48 ITER_PER_VU=7

      - name: Integrity audit — what was committed, not what was answered
        run: make load-verify

      - name: Logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── The split topology: WALLET_MODE=api + WALLET_MODE=workers ──────────────
  e2e-split:
    name: e2e split (api + workers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Two-role topology end-to-end
        # Same image, two processes. If this passes, the claim in the README
        # ("api answers traffic while a separate workers process drains the
        # queue") is verified on every push, not just argued.
        run: SPLIT=1 ./scripts/e2e.sh

      - name: Logs from both roles (on failure)
        if: failure()
        run: |
          docker compose --profile split logs --no-color --tail=200

  # ── Build the deployable image and smoke-test the binary ───────────────────
  image:
    name: image (build · non-root · probes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t wallet:ci .

      - name: The image runs as a non-root user
        # Security invariant worth enforcing mechanically: the Dockerfile has
        # USER app, and a regression that drops it fails here.
        run: |
          uid="$(docker run --rm --entrypoint id wallet:ci -u)"
          echo "container uid: $uid"
          [ "$uid" != "0" ] || { echo "::error::image runs as root"; exit 1; }

      - name: version subcommand is dependency-free
        # `walletd version` must not need a DB or any config: it parses args
        # before building the Fx graph, which is what makes the binary usable
        # as an ops/health probe from a bare container.
        run: docker run --rm --entrypoint walletd wallet:ci version

      - name: The version gets stamped into the binary
        # The point of the -ldflags in the Dockerfile is that a shipped
        # container can answer "what am I running?" without the tag it was
        # pulled by. Nothing else in CI proves the flag actually reaches the
        # right symbol — a typo in the package path or variable name would
        # leave every image reporting `dev` and no test would notice, because
        # the binary still runs perfectly. So build with a known version and
        # assert on the output.
        #
        # The default (`dev`) is the other half of the claim: an unstamped
        # build must admit it is unstamped rather than guess.
        run: |
          out="$(docker run --rm --entrypoint walletd wallet:ci version)"
          echo "unstamped: $out"
          grep -q 'walletd dev ' <<<"$out" \
            || { echo "::error::the default build no longer reports 'dev': $out"; exit 1; }

          docker build -q \
            --build-arg VERSION=v9.9.9-ci \
            --build-arg COMMIT=cafebabe \
            --build-arg DATE=2026-01-01T00:00:00Z \
            -t wallet:ci-stamped . >/dev/null
          out="$(docker run --rm --entrypoint walletd wallet:ci-stamped version)"
          echo "stamped:   $out"
          grep -q 'v9\.9\.9-ci' <<<"$out" \
            || { echo "::error::VERSION did not reach buildinfo.Version: $out"; exit 1; }
          grep -q 'cafebabe' <<<"$out" \
            || { echo "::error::COMMIT did not reach buildinfo.Commit: $out"; exit 1; }
          echo "the tag, commit and date are baked in and readable"

      - name: The binary refuses to start with invalid configuration
        # Fail-fast is a feature: a bad WALLET_MODE must stop the process at
        # config load, not degrade into an unintended topology.
        #
        # Note: this runs the app WITHOUT a subcommand on purpose. `walletd
        # version` returns before config is read, so testing it would prove
        # nothing; the full boot path is where validation lives. The other
        # variables point at unreachable addresses — config validation runs
        # before any connection is attempted, so the failure is the mode.
        run: |
          set +e
          docker run --rm \
            -e WALLET_MODE=banana \
            -e WALLET_DB_DSN='postgres://x:x@127.0.0.1:1/x' \
            -e WALLET_AUTH_ISSUER='http://127.0.0.1:1/realms/x' \
            -e WALLET_SQS_ENDPOINT='http://127.0.0.1:1' \
            --entrypoint walletd wallet:ci >/tmp/out 2>&1
          status=$?
          set -e
          echo "exit=$status"
          cat /tmp/out
          [ "$status" -ne 0 ] || { echo "::error::invalid WALLET_MODE was accepted"; exit 1; }
          grep -q 'WALLET_MODE must be all|api|workers' /tmp/out \
            || { echo "::error::unexpected error message"; exit 1; }
          echo "rejected with the expected message"
